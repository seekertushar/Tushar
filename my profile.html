<!DOCTYPE html>
<html>
<head>
    <title>MY PERSONAL PROFILE</title>
    
    <!-- 1. External CSS Link Requirement -->
    <link rel="stylesheet" href="myprofile.css">

    <!-- 2. Internal CSS (Demonstrates Element, Class, ID, Universal, & Grouping Selectors) -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; } /* Universal Selector */
        
        body { font-family: sans-serif; line-height: 1.5; background-color: #f0f2f5; padding: 20px; } /* Element */
        
        h1, h2 { color: #333; font-weight: bold; } /* Grouping Selector */
        
        #main-card { background: white; max-width: 500px; margin: auto; padding: 20px; border: 2px solid #ccc; } /* ID */
        
        .box { margin-bottom: 15px; border-bottom: 1px solid #ddd; padding-bottom: 10px; } /* Class */
        
        .box ul { list-style: square; padding-left: 20px; } /* Descendant Selector */
    </style>
</head>
<body>

    <div id="main-card">
        <!-- 3. Inline CSS used here (text-alignment & text-decoration) -->
        <header style="text-align: center; text-decoration: underline;">
            <h1>MY PERSONAL PROFILE</h1>
            <p>Welcome to my personal profile!</p>
            <h2>TUSHAR YADAV</h2>
            <img src="WhatsApp Image 2026-09-15 at 10.32.20 AM.jpeg" alt="Profile Picture" style="width: 150px; height: 150px; border-radius: 50%; margin-top: 10px;">

        </header>

        <section class="box">
            <h2>Introduction</h2>
            <p>Hi, I am a student learning web design and building clean websites.</p>
        </section>

        <section class="box">
            <h2>Hobbies</h2>
            <ul>
                <li>Coding</li>
                <li>Gaming</li>
                <li>Playing chess</li>
            </ul>
        </section>

        <section class="box" style="border: none;">
            <h2>Education</h2>
            <p><b>MCA 1st YEAR</b> -KIET DEEMED TO BE UNIVERSITY</p>
        </section>
    </div>

</body>
</html>
