<!DOCTYPE html>
<html>
<head>
<style>
  body{
    background:white;
    font-family: Times New Roman;
  }
  .box1{
    background: #b6e6f5;
    border: 1px solid black;
    border-radius: 5px;
    width: 90%;
    padding: 20px;
    margin: 20px;
  }
  .small{
    width: 75px;
    height: 60px;
    background: rgb(171, 230, 249);
    border: 2px solid black;
    margin-top: 100px;
    margin-right: 150px;
    margin-bottom: 100px;
    margin-left: 80px;
  }
</style>
</head>
<body>

<p><b>using individualmargin properties</b></p>

<div class="box1">
  <p style="font-size:13px;"><b>This div element has a top margin of</b></p>
  <div class="small">
    <span style="color:red; font-size:12px;"><u>100px</u></span>
  </div>
  <p style="font-size:13px;"><b>, a right margin of 150px, a bottom margin of 100px, and a left margin of 80px.</b></p>
</div>

</body>
</html>
